<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 28 705 292" role="img" aria-label="Synaptix AI Labs - Programando con Sistemas Inteligentes">
  <defs>
    <linearGradient id="animatedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF">
        <animate attributeName="stop-color" values="#00E5FF; #0066FF; #8A2BE2; #00E5FF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8A2BE2">
        <animate attributeName="stop-color" values="#8A2BE2; #00E5FF; #0066FF; #8A2BE2" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="382" text-anchor="middle" y="140" font-size="110" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Synaptix</text>
    <text x="382" text-anchor="middle" y="240" font-size="85" font-weight="400" fill="url(#animatedGrad)" letter-spacing="1">AI Labs</text>
    <text x="382" text-anchor="middle" y="300" font-size="28" font-weight="400" fill="#A0AABF" letter-spacing="2">Programando con Sistemas Inteligentes</text>
  </g>
</svg>
